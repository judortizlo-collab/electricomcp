[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electromcp"
version = "0.1.0"
description = "Servidor MCP para diseño eléctrico (NTC 2050 / RETIE) en AutoCAD y DXF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ezdxf>=1.3",
  "mcp>=1.2",  # compatible con SDK 1.x (FastMCP) y 2.x (MCPServer)
  "pydantic>=2.6",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
preview = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
electromcp = "electromcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
